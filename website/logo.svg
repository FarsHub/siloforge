<svg viewBox="0 0 58 58" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="bodyClip">
            <rect x="10" y="26" width="38" height="24" rx="1"/>
          </clipPath>
        </defs>

        <!-- Badge background -->
        <rect width="58" height="58" rx="12" fill="#14472c"/>

        <!-- ── SILO CONICAL ROOF ── -->
        <!-- Roof fill -->
        <polygon points="29,7 48,26 10,26" fill="#1d6640"/>
        <!-- Roof ridge cap (small flat band at peak) -->
        <rect x="26" y="6" width="6" height="3" rx="1" fill="#2d8653"/>
        <!-- Roof shading line (right face highlight) -->
        <line x1="29" y1="7" x2="48" y2="26" stroke="white" stroke-width="0.6" opacity="0.15"/>

        <!-- ── SILO BODY ── -->
        <rect x="10" y="26" width="38" height="24" rx="1" fill="#1d6640"/>

        <!-- Horizontal corrugation bands -->
        <line x1="10" y1="30" x2="48" y2="30" stroke="white" stroke-width="0.6" opacity="0.12"/>
        <line x1="10" y1="34" x2="48" y2="34" stroke="white" stroke-width="0.6" opacity="0.12"/>
        <line x1="10" y1="38" x2="48" y2="38" stroke="white" stroke-width="0.6" opacity="0.12"/>
        <line x1="10" y1="42" x2="48" y2="42" stroke="white" stroke-width="0.6" opacity="0.12"/>
        <line x1="10" y1="46" x2="48" y2="46" stroke="white" stroke-width="0.6" opacity="0.12"/>

        <!-- ── COMBO CHART (clipped inside body) ── -->
        <g clip-path="url(#bodyClip)">
          <!-- Bar chart -->
          <rect x="13" y="40" width="6" height="10" rx="0.8" fill="white" opacity="0.75"/>
          <rect x="21" y="35" width="6" height="15" rx="0.8" fill="#6dbf8a" opacity="0.9"/>
          <rect x="29" y="37" width="6" height="13" rx="0.8" fill="white" opacity="0.65"/>
          <rect x="37" y="32" width="6" height="18" rx="0.8" fill="#6dbf8a"/>

          <!-- Trend line (connecting bar midpoints at top) -->
          <polyline
            points="16,39 24,34 32,36 40,31"
            stroke="white"
            stroke-width="1.8"
            fill="none"
            stroke-linecap="round"
            stroke-linejoin="round"/>

          <!-- Dots on trend line -->
          <circle cx="16" cy="39" r="2" fill="white"/>
          <circle cx="24" cy="34" r="2" fill="white"/>
          <circle cx="32" cy="36" r="2" fill="white"/>
          <circle cx="40" cy="31" r="2" fill="white"/>
        </g>

        <!-- Body outline (subtle) -->
        <rect x="10" y="26" width="38" height="24" rx="1" fill="none" stroke="white" stroke-width="0.5" opacity="0.12"/>
      </svg>
