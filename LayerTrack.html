function updateSaleBalanceHint(){
  const hint=document.getElementById('sf_balance_hint');
  const totalEl=document.getElementById('sf_total');
  const downEl=document.getElementById('sf_down');
  if(!hint||!totalEl||!downEl)return;
  const total=parseFloat(totalEl.value)||0;
  const down=parseFloat(downEl.value)||0;
  if(total<=0){hint.innerHTML='';return;}
  if(down<=0){
    hint.innerHTML=`Full <b>${fmtMoney(total)}</b> on credit.`;
  } else if(down>=total){
    hint.innerHTML=`<span style="color:var(--amber)">Down payment ≥ total — switch to Cash instead.</span>`;
  } else {
    const bal=total-down;
    hint.innerHTML=`Down <b>${fmtMoney(down)}</b> · Balance <b style="color:var(--amber)">${fmtMoney(bal)}</b>`;
  }
}
function updateCreditCheckPanel(editId){
  const panel=document.getElementById('sf_credit_check');
  if(!panel)return;
  const payType=document.getElementById('sf_pay')?.value;
  const product=document.getElementById('sf_prod')?.value;
  const isCredit=payType==='credit';
  const isEggs=product==='Eggs — Crates';
  // Preserve any reason already typed before we re-render
  const priorReasonEl=document.getElementById('sf_override_reason');
  const priorReason=priorReasonEl?priorReasonEl.value:'';
  if(!isCredit||!isEggs){panel.innerHTML='';return;}
  const qty=parseInt(document.getElementById('sf_qty')?.value,10)||0;
  const total=parseFloat(document.getElementById('sf_total')?.value)||0;
  const down=parseFloat(document.getElementById('sf_down')?.value)||0;
  const newCommitCrates=total>0?qty*Math.max(0,(total-down))/total:qty;
  const env=getCreditEnvelope();
  let adjustedCommitted=env.committedCrates;
  if(editId){
    const existing=DB.getSales().find(s=>s.id===editId);
    if(existing&&existing.product==='Eggs — Crates'&&existing.payment_type==='credit'){
      const existingTotal=Number(existing.total_amount_ngn||0);
      const existingBal=getSaleBalance(existing);
      if(existingTotal>0&&existingBal>0){
        adjustedCommitted-=Number(existing.quantity||0)*(existingBal/existingTotal);
      }
    }
  }
  const adjustedHeadroom=env.envelopeCrates-adjustedCommitted;
  const newTotalCommitted=adjustedCommitted+newCommitCrates;
  const exceedsBy=newTotalCommitted-env.envelopeCrates;
  const overGate=exceedsBy>0.5;
  const customerId=document.getElementById('sf_cust_id')?.value;
  const customerOwing=customerId?getCustomerOutstanding(customerId):0;
  const utilizationPct=env.envelopeCrates>0?(newTotalCommitted/env.envelopeCrates*100):0;
  const barColor=overGate?'var(--red)':utilizationPct>80?'var(--amber)':'var(--g3)';
  const bgColor=overGate?'#fde8ea':'var(--g5)';
  const existingRec=editId?DB.getSales().find(s=>s.id===editId):null;
  const savedReason=existingRec?.credit_gate_override_reason||'';
  const reasonValue=priorReason||savedReason;
  let html=`<div style="margin:8px 0;padding:10px 12px;background:${bgColor};border-radius:8px;border-left:3px solid ${barColor}">
    <div style="font-size:11px;font-weight:700;color:var(--g1);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px">Credit Check</div>`;
  if(customerId){
    html+=`<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">
      <span>This customer currently owes</span>
      <b style="color:${customerOwing>0?'var(--amber)':'var(--g3)'}">${fmtMoney(customerOwing)}</b>
    </div>`;
  }
  html+=`<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">
    <span>Farm credit pool</span>
    <b>${env.envelopeCrates} crates @ ${env.effectivePct.toFixed(0)}%${env.flexPct>0?` (flex +${env.flexPct.toFixed(0)}%)`:''}</b>
  </div>
  <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px">
    <span>Headroom before this sale</span>
    <b style="color:${adjustedHeadroom<=0?'var(--red)':adjustedHeadroom<env.envelopeCrates*0.2?'var(--amber)':'var(--g3)'}">${adjustedHeadroom.toFixed(1)} crates</b>
  </div>
  <div style="height:6px;background:#e0e0e0;border-radius:3px;overflow:hidden;margin-bottom:4px">
    <div style="height:100%;background:${barColor};width:${Math.min(100,Math.max(0,utilizationPct)).toFixed(1)}%"></div>
  </div>
  <div style="font-size:11px;color:var(--g1)">
    After this sale: <b>${newTotalCommitted.toFixed(1)} / ${env.envelopeCrates}</b> crates committed (${utilizationPct.toFixed(0)}%)
  </div>`;
  if(overGate){
    html+=`<div style="margin-top:8px;padding-top:8px;border-top:1px solid rgba(214,40,57,0.2)">
      <div style="font-size:12px;color:var(--red);font-weight:700;margin-bottom:6px">
        ⚠ This sale exceeds the credit pool by ${exceedsBy.toFixed(1)} crate${exceedsBy>=2?'s':''}.
      </div>
      <label style="font-size:11px;color:var(--g1);font-weight:600">Reason to proceed <span style="color:var(--red)">*</span></label>
      <textarea id="sf_override_reason" placeholder="e.g. Trusted long-term customer, will collect by next week…" style="margin-top:4px;width:100%;padding:8px;border:1px solid #ddd;border-radius:6px;font-family:inherit;font-size:13px;min-height:60px">${reasonValue.replace(/</g,'&lt;')}</textarea>
    </div>`;
  } else if(savedReason){
    html+=`<div style="margin-top:8px;padding-top:8px;border-top:1px solid #eee;font-size:11px;color:var(--gray)">
      Previous override reason: <i>"${savedReason.replace(/</g,'&lt;')}"</i>
    </div>`;
  }
  html+=`</div>`;
  panel.innerHTML=html;
}
function saveSale(editId){
  const payType=document.getElementById('sf_pay').value;
  const isCredit=payType==='credit';
  const typedName=(document.getElementById('sf_cust')?.value||'').trim();
  let customerId=document.getElementById('sf_cust_id')?.value||'';
  if(isCredit&&!typedName){toast('Enter a customer name for credit sale');return;}
  const qty=parseInt(document.getElementById('sf_qty').value,10)||0;
  if(!Number.isInteger(qty)||qty<1){toast('Quantity must be at least 1');return;}
  const price=parseFloat(document.getElementById('sf_price').value)||0;
  const total=parseFloat(document.getElementById('sf_total').value)||(qty*price);
  let downPayment=0;
  if(!editId&&isCredit){
    downPayment=parseFloat(document.getElementById('sf_down')?.value)||0;
    if(downPayment<0){toast('Down payment cannot be negative');return;}
    if(downPayment>=total){toast('Down payment ≥ total — switch to Cash');return;}
  }
  const saleDate=document.getElementById('sf_date').value;
  const product=document.getElementById('sf_prod').value;
  // Portfolio gate (only credit sales of egg crates draw on the envelope)
  let overrideReason='';
  let gateBreached=false;
  if(isCredit&&product==='Eggs — Crates'){
    const newCommitCrates=total>0?qty*Math.max(0,(total-downPayment))/total:qty;
    const env=getCreditEnvelope();
    let adjustedCommitted=env.committedCrates;
    if(editId){
      const ex=DB.getSales().find(s=>s.id===editId);
      if(ex&&ex.product==='Eggs — Crates'&&ex.payment_type==='credit'){
        const exTotal=Number(ex.total_amount_ngn||0);
        const exBal=getSaleBalance(ex);
        if(exTotal>0&&exBal>0)adjustedCommitted-=Number(ex.quantity||0)*(exBal/exTotal);
      }
    }
    if(adjustedCommitted+newCommitCrates-env.envelopeCrates>0.5){
      gateBreached=true;
      const reasonEl=document.getElementById('sf_override_reason');
      overrideReason=(reasonEl?.value||'').trim();
      if(!overrideReason){toast('This sale exceeds the credit pool — type a reason to proceed');return;}
    }
  }
  if(typedName&&!customerId){
    const exact=findCustomerByName(typedName);
    if(exact){
      customerId=exact.id;
    } else {
      const phoneEl=document.getElementById('sf_new_phone');
      const typeEl=document.getElementById('sf_new_type');
      const newCust={
        id:uid(),
        name:typedName,
        name_normalized:normalizeCustomerName(typedName),
        phone:phoneEl?phoneEl.value.trim():'',
        customer_type:typeEl?typeEl.value:'Individual',
        notes:'',
        created_at:DB.today()
      };
      DB.addCustomer(newCust);
      customerId=newCust.id;
    }
  }
  const existingRec=editId?DB.getSales().find(s=>s.id===editId):null;
  const rec={
    id:editId||uid(),
    date:saleDate,
    product:product,
    quantity:qty,
    unit_price_ngn:price,
    total_amount_ngn:total,
    payment_type:payType,
    paid:existingRec?existingRec.paid:!isCredit,
    due_date:isCredit?(document.getElementById('sf_due')?.value||null):null,
    customer_id:customerId||null,
    customer:typedName,
    seller:(document.getElementById('sf_seller')?.value||'').trim(),
    notes:document.getElementById('sf_notes').value.trim(),
    credit_gate_override_reason:gateBreached?overrideReason:(existingRec?.credit_gate_override_reason||null)
  };
  if(rec.seller)localStorage.setItem(LAST_SELLER_KEY,rec.seller);
  // Carry the reference forward on edit — a document already given to a customer
  // keeps its number even if the sale's date or amount is corrected afterwards.
  rec.doc_ref=existingRec?.doc_ref||nextDocRef(rec);
  rec.doc_issued_at=existingRec?.doc_issued_at||saleDate;
  if(editId){
    DB.updSale(editId,rec);
  } else {
    DB.addSale(rec);
    if(!isCredit){
      DB.addPayment({id:uid(),sale_id:rec.id,date:saleDate,amount_ngn:total,method:'Cash',kind:'sale_payment',notes:'Full payment at sale'});
    } else if(downPayment>0){
      DB.addPayment({id:uid(),sale_id:rec.id,date:saleDate,amount_ngn:downPayment,method:'Cash',kind:'down_payment',notes:'Down payment'});
    }
  }
  closeModal();
  if(!editId&&isCredit&&downPayment>0){
    confirmSave(`Sale recorded — ${fmtMoney(downPayment)} paid, ${fmtMoney(total-downPayment)} on credit`);
  } else if(!editId&&isCredit){
    confirmSave('Credit sale recorded — see Receivables');
  } else if(!editId){
    confirmSave('Cash sale recorded');
  } else {
    confirmSave('Sale updated');
  }
  renderFinance();
}

function savePayment(saleId,paymentEditId){
  const sale=DB.getSales().find(s=>s.id===saleId);
  if(!sale){toast('Sale not found');closeModal();return;}
  const amount=parseFloat(document.getElementById('pf_amount').value)||0;
  if(amount<=0){toast('Amount must be greater than 0');return;}
  const total=Number(sale.total_amount_ngn||0);
  const otherPaid=DB.paymentsForSale(saleId)
    .filter(p=>p.id!==paymentEditId)
    .reduce((s,p)=>s+Number(p.amount_ngn||0),0);
  if(otherPaid+amount>total+0.5){
    toast(`Exceeds outstanding ${fmtMoney(Math.max(0,total-otherPaid))}`);return;
  }
  const rec={
    id:paymentEditId||uid(),
    sale_id:saleId,
    date:document.getElementById('pf_date').value,
    amount_ngn:amount,
    method:document.getElementById('pf_method').value,
    kind:paymentEditId?undefined:'sale_payment',
    notes:document.getElementById('pf_notes').value.trim()
  };
  if(paymentEditId){
    DB.updPayment(paymentEditId,{date:rec.date,amount_ngn:rec.amount_ngn,method:rec.method,notes:rec.notes});
  } else {
    DB.addPayment(rec);
  }
  const newPaid=otherPaid+amount;
  if(newPaid>=total-0.5){
    DB.updSale(saleId,{paid:true});
    confirmSave('Payment recorded — fully paid');
  } else {
    if(sale.paid)DB.updSale(saleId,{paid:false});
    confirmSave(`Payment recorded — ${fmtMoney(total-newPaid)} still owing`);
  }
  closeModal();renderFinance();
}

function sortCells(arr){
  if(!CELL_SORT.field)return arr;
  return [...arr].sort((a,b)=>{
    const av=CELL_SORT.field==='rate'?(a.rate??-1):(a.totalEggs>0?a.totalBroken/a.totalEggs*100:-1);
    const bv=CELL_SORT.field==='rate'?(b.rate??-1):(b.totalEggs>0?b.totalBroken/b.totalEggs*100:-1);

  if(!ANA_DATE)return allCols;

// FEED ANALYTICS
// ═══════════════════════════════════════════════
// FCR here is kg feed / kg eggs. A laying flock sits around 2.0–2.4; anything
// near 8 would mean the birds are eating four times their output, so the old
// "< 8" target could never fail and coloured everything green.
const EGG_KG = 0.06, FCR_GOOD = 2.2, FCR_WARN = 2.5;
const FEED_TBL = {log:false, gbd:false, mom:true};
function toggleFeedTbl(k){ FEED_TBL[k]=!FEED_TBL[k]; renderReports(); }
function fcrColour(v){ return v==null?'var(--gray)':v<FCR_GOOD?'var(--g2)':v<FCR_WARN?'var(--amber)':'var(--red)'; }

// One row per calendar date, merging feed and egg logs and resolving how many
// birds were alive that day. Bird records are authoritative; where none exist we
// back it out of the saved requirement (req kg = birds x rate), then fall back to
// the configured flock size.
function feedDailySeries(validPenIds){
  const farm=DB.getFarm()||{pens:[]};
  const sortedBirds=DB.getBirds().filter(b=>(b.closing_birds||0)>0).sort((a,b)=>a.date.localeCompare(b.date));
  const totalNow=getFarmTotalBirds(farm)||0;
  const map={};
  const touch=d=>(map[d]=map[d]||{date:d,kg:0,req:0,eggs:0,rate:0,rateN:0,age:null,types:{}});
  DB.getFeed().forEach(r=>{
    const d=touch(r.date);
    d.kg+=r.feed_kg_used||0; d.req+=r.feed_req_kg||0;
    if(r.feed_type)d.types[r.feed_type]=1;
    const g=r.feed_rate_g||getLayerFeedRate(r.age_weeks||0);
    if(g){d.rate+=g;d.rateN++;}
    if(r.age_weeks!=null)d.age=r.age_weeks;
  });
  DB.getCols().filter(c=>validPenIds.has(c.penId)).forEach(c=>{
    touch(c.date).eggs+=(c.entries||[]).reduce((s,e)=>s+(e.eggs||0),0);
  });
  // Bird count per day, in order of trust:
  //   1. the last flock record on or before that date (carry forward)
  //   2. the earliest flock record, for days before any record exists — a real
  //      count from the wrong date still beats today's configured total
  //   3. back-calculated from the saved requirement (req kg = birds x rate)
  //   4. the configured flock size, only when no flock records exist at all
  const firstCount=sortedBirds.length?sortedBirds[0].closing_birds:null;
  let ptr=0,last=null;
  return Object.values(map).sort((a,b)=>a.date.localeCompare(b.date)).map(d=>{
    while(ptr<sortedBirds.length&&sortedBirds[ptr].date<=d.date){last=sortedBirds[ptr].closing_birds;ptr++;}
    const stdG=d.rateN?Math.round(d.rate/d.rateN):getLayerFeedRate(d.age||0);
    let birds=last||firstCount;
    if(!birds&&stdG>0&&d.req>0)birds=Math.round(d.req*1000/stdG);
    if(!birds)birds=totalNow;
    return {date:d.date,kg:d.kg,req:d.req,eggs:d.eggs,age:d.age,stdG,birds,
      types:Object.keys(d.types).join(', '),
      gPerBird:(birds>0&&d.kg>0)?d.kg*1000/birds:null};
  });
}

// Month buckets. Bird-days are accumulated separately for feed and eggs so a day
// missing one log does not distort the other's per-bird rate.
function feedMonthlyRows(daily){
  const m={};
  daily.forEach(d=>{
    const k=d.date.slice(0,7);
    const o=(m[k]=m[k]||{m:k,kg:0,eggs:0,feedBirdDays:0,eggBirdDays:0,ageSum:0,ageN:0,days:0});
    o.kg+=d.kg; o.eggs+=d.eggs; o.days++;
    if(d.kg>0)o.feedBirdDays+=d.birds;
    if(d.eggs>0)o.eggBirdDays+=d.birds;
    if(d.age!=null){o.ageSum+=d.age;o.ageN++;}
  });
  return Object.values(m).sort((a,b)=>a.m.localeCompare(b.m)).map(o=>({
    m:o.m, kg:o.kg, eggs:o.eggs, days:o.days,
    age:o.ageN?Math.round(o.ageSum/o.ageN):null,
    lay:o.eggBirdDays>0?o.eggs/o.eggBirdDays*100:null,
    gpb:o.feedBirdDays>0?o.kg*1000/o.feedBirdDays:null,
    gpe:o.eggs>0?o.kg*1000/o.eggs:null,
    fcr:o.eggs>0?o.kg/(o.eggs*EGG_KG):null
  }));
}

const _FEED_CHARTS={};
function _niceTicks(min,max,n){
  const span=max-min||1, raw=span/n, mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const step=[1,2,2.5,5,10].map(x=>x*mag).find(s=>s>=raw)||10*mag;
  const lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step, out=[];
  for(let v=lo;v<=hi+1e-9;v+=step)out.push(+v.toFixed(6));
  return out;
}
function lineChartSvg(id,rows,series,opts){
  opts=opts||{};
  const dec=opts.dec||0, unit=opts.unit||'', band=opts.band;
  const W=640,H=190,PL=38,PR=46,PT=12,PB=26,cw=W-PL-PR,ch=H-PT-PB;
  const all=rows.flatMap(r=>series.map(s=>s.get(r))).filter(v=>v!=null&&isFinite(v));
  if(!all.length||rows.length<2)return '<div style="color:var(--gray);font-size:13px;padding:20px 0">Not enough data yet.</div>';
  // Pad the domain so a flat reference line never lands on the axis floor.
  const dmin=Math.min(...all), dmax=Math.max(...all), pad=(dmax-dmin||1)*0.12;
  const ticks=_niceTicks(dmin-pad,dmax+pad,4), lo=ticks[0], hi=ticks[ticks.length-1];
  const yOf=v=>PT+ch-((v-lo)/(hi-lo))*ch, xAt=i=>PL+i*(cw/(rows.length-1));
  let bandSvg='';
  if(band){ // clamped, or it paints outside the plot
    const b0=Math.max(lo,Math.min(band[0],hi)), b1=Math.max(lo,Math.min(band[1],hi));
    if(b1>b0)bandSvg=`<rect x="${PL}" y="${yOf(b1).toFixed(1)}" width="${cw}" height="${(yOf(b0)-yOf(b1)).toFixed(1)}" fill="#12946a" opacity=".08"/>
      <text x="${W-PR-2}" y="${(yOf(b1)-4).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--gray)">target &lt; ${band[1]}</text>`;
  }
  const grid=ticks.map(t=>`<line x1="${PL}" y1="${yOf(t).toFixed(1)}" x2="${W-PR}" y2="${yOf(t).toFixed(1)}" stroke="#ecefed" stroke-width="1"/>
    <text x="${PL-6}" y="${(yOf(t)+3.5).toFixed(1)}" text-anchor="end" font-size="9.5" fill="var(--gray)">${t}</text>`).join('');
  const lines=series.map(s=>{
    const pts=rows.map((r,i)=>s.get(r)==null?null:`${xAt(i).toFixed(1)},${yOf(s.get(r)).toFixed(1)}`).filter(Boolean).join(' ');
    return `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"${s.dash?' stroke-dasharray="5 3"':''}/>`;
  }).join('');
  const ends=series.map(s=>{
    let i=rows.length-1; while(i>=0&&s.get(rows[i])==null)i--;
    if(i<0)return '';
    const v=s.get(rows[i]),x=xAt(i),y=yOf(v);
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" fill="${s.color}" stroke="#fff" stroke-width="2"/>
      <text x="${(x+9).toFixed(1)}" y="${(y+3.5).toFixed(1)}" font-size="10.5" font-weight="700" fill="var(--g1)">${v.toFixed(dec)}</text>`;
  }).join('');
  const step=Math.ceil(rows.length/5);
  const xlab=rows.map((r,i)=>(i%step===0||i===rows.length-1)
    ? `<text x="${xAt(i).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="9.5" fill="var(--gray)">${opts.xOf(r)}</text>`:'').join('');
  _FEED_CHARTS[id]={rows,series,dec,unit,geom:{W,PL,PR,PT,ch,cw},xOf:opts.xOf,extra:opts.extra};
  return `<div class="chartbox" id="cb-${id}"><div class="charttt" id="tt-${id}"></div>
    <svg viewBox="0 0 ${W} ${H}">${bandSvg}${grid}
      <line id="cx-${id}" x1="0" y1="${PT}" x2="0" y2="${PT+ch}" stroke="#c9d2cd" stroke-width="1" opacity="0"/>
      ${lines}${ends}${xlab}
      <rect id="hit-${id}" x="${PL}" y="${PT}" width="${cw}" height="${ch}" fill="transparent"/></svg></div>`;
}
// innerHTML wipes listeners, so renderReports re-wires after every paint.
function wireFeedCharts(){
  Object.keys(_FEED_CHARTS).forEach(id=>{
    const c=_FEED_CHARTS[id], box=document.getElementById('cb-'+id), hit=document.getElementById('hit-'+id);
    if(!box||!hit)return;
    const tt=document.getElementById('tt-'+id), cx=document.getElementById('cx-'+id), g=c.geom;
    const move=e=>{
      const rect=box.getBoundingClientRect();
      const px=(e.touches?e.touches[0].clientX:e.clientX)-rect.left;
      const i=Math.max(0,Math.min(c.rows.length-1,Math.round((px/rect.width*g.W-g.PL)/(g.cw/(c.rows.length-1)))));
      const r=c.rows[i], x=g.PL+i*(g.cw/(c.rows.length-1));
      cx.setAttribute('x1',x);cx.setAttribute('x2',x);cx.setAttribute('opacity','1');
      tt.innerHTML=`<b>${c.xOf(r)}</b>`+c.series.map(s=>{
        const v=s.get(r); if(v==null)return '';
        return `<div class="ttr"><em><span class="ttk" style="background:${s.color}"></span>${s.name}</em><strong>${v.toFixed(c.dec)}${c.unit}</strong></div>`;
      }).join('')+(c.extra?c.extra(r):'');
      tt.style.opacity=1;
      const lx=x/g.W*rect.width;
      tt.style.left=Math.max(2,Math.min(rect.width-150,lx-75))+'px';
      tt.style.top='4px';
    };
    hit.addEventListener('pointermove',move);
    hit.addEventListener('pointerleave',()=>{tt.style.opacity=0;cx.setAttribute('opacity','0');});
  });
}

      const _yMax=Math.ceil(_rawMax/10)*10;
      window._trendPts=_tPoints;
      const _trendSvg=(()=>{
        const pts=_tPoints,n=pts.length;
        if(n<2)return`<div style="color:var(--gray);font-size:13px;padding:24px 0;text-align:center">Not enough data — log eggs across at least 2 ${isWeekly?'weeks':'months'} to see the trend.</div>`;
        const svgW=600,cH=110,lblH=18,svgH=cH+lblH,padL=36,padR=8,plotW=svgW-padL-padR;
        const yp=(v)=>(cH-6)-(Math.min(Math.max(v,0),_yMax)/_yMax)*(cH-12)+2;
        const xp=(i)=>padL+(i/Math.max(n-1,1))*plotW;
        const yAxisLbls=(()=>{
          const parts=[];
          for(let v=0;v<=_yMax;v+=10){
            const y=yp(v);
            parts.push(`<text x="${padL-3}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="8" fill="#bbb">${v}</text>`);
          }
          parts.push(`<line x1="${padL}" y1="${yp(0).toFixed(1)}" x2="${svgW-padR}" y2="${yp(0).toFixed(1)}" stroke="#eee" stroke-width="1"/>`);
          return parts.join('');
        })();
        const bench=(_yMax>=80?`<line x1="${padL}" y1="${yp(80).toFixed(1)}" x2="${svgW-padR}" y2="${yp(80).toFixed(1)}" stroke="#27ae60" stroke-width="1" stroke-dasharray="5,3" opacity="0.7"/>
          <text x="${padL-3}" y="${(yp(80)+3).toFixed(1)}" text-anchor="end" font-size="8" fill="#27ae60" font-weight="700">80</text>`:'')
          +(_yMax>=70?`<line x1="${padL}" y1="${yp(70).toFixed(1)}" x2="${svgW-padR}" y2="${yp(70).toFixed(1)}" stroke="#e67e22" stroke-width="1" stroke-dasharray="5,3" opacity="0.7"/>
          <text x="${padL-3}" y="${(yp(70)+3).toFixed(1)}" text-anchor="end" font-size="8" fill="#e67e22" font-weight="700">70</text>`:'');
        const linePts=pts.map((p,i)=>`${xp(i).toFixed(1)},${yp(p.hdp).toFixed(1)}`).join(' ');
        const area=`<polygon points="${xp(0).toFixed(1)},${cH+2} ${linePts} ${xp(n-1).toFixed(1)},${cH+2}" fill="url(#tGrad)" opacity="0.18"/>`;
        const segs=pts.slice(0,-1).map((p,i)=>{const x1=xp(i),y1=yp(p.hdp),x2=xp(i+1),y2=yp(pts[i+1].hdp);const avg=(p.hdp+pts[i+1].hdp)/2;const col=avg>=80?'#27ae60':avg>=70?'#e67e22':'#c0392b';return`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${col}" stroke-width="2.5" stroke-linecap="round"/>`;}).join('');
        const dots=pts.map((p,i)=>{const x=xp(i),y=yp(p.hdp),isPk=p===_peakPt,col=p.hdp>=80?'#27ae60':p.hdp>=70?'#e67e22':'#c0392b';return`<g onmouseenter="showTrendTip(event,_trendPts[${i}])" onmouseleave="hideTrendTip()" onmousemove="positionTrendTip(event)" style="cursor:pointer"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="11" fill="transparent"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${isPk?4.5:2.5}" fill="${col}" stroke="white" stroke-width="1.5"/>${isPk?`<text x="${x.toFixed(1)}" y="${(y-10).toFixed(1)}" text-anchor="middle" font-size="9" fill="${col}" font-weight="800">▲${p.hdp.toFixed(0)}%</text>`:''}</g>`;}).join('');
        const lstep=Math.ceil(n/10);
        const xlbls=pts.map((p,i)=>i%lstep===0||i===n-1?`<text x="${xp(i).toFixed(1)}" y="${svgH-1}" text-anchor="middle" font-size="7.5" fill="#aaa">${p.label}</text>`:'').join('');
        return`<svg viewBox="0 0 ${svgW} ${svgH}" style="width:100%;height:auto;display:block;overflow:visible">
          <defs><linearGradient id="tGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#27ae60" stop-opacity="0.4"/><stop offset="100%" stop-color="#27ae60" stop-opacity="0"/></linearGradient></defs>
          ${yAxisLbls}${bench}${area}${segs}${dots}${xlbls}</svg>`;

      const _lbl=isWeekly?'Week':'Month';
      tabContent=`
        <div style="display:flex;align-items:center;gap:8px;margin:10px 16px 2px">

        </div>
        <div class="sec-hdr" style="margin-top:4px">Production Trend — ${isWeekly?'By Flock Age Week':'By Calendar Month'}</div>
        <div class="card" style="padding:16px">
          ${_trendSvg}
          <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--gray)">
            <span><svg width="20" height="8" viewBox="0 0 20 8" style="vertical-align:middle"><line x1="1" y1="4" x2="19" y2="4" stroke="#27ae60" stroke-width="2.5"/></svg> ≥80%</span>
            <span><svg width="20" height="8" viewBox="0 0 20 8" style="vertical-align:middle"><line x1="1" y1="4" x2="19" y2="4" stroke="#e67e22" stroke-width="2.5"/></svg> 70–80%</span>
            <span><svg width="20" height="8" viewBox="0 0 20 8" style="vertical-align:middle"><line x1="1" y1="4" x2="19" y2="4" stroke="#c0392b" stroke-width="2.5"/></svg> &lt;70%</span>
            ${_yMax>=80?`<span><svg width="20" height="8" viewBox="0 0 20 8" style="vertical-align:middle"><line x1="1" y1="4" x2="19" y2="4" stroke="#27ae60" stroke-width="1" stroke-dasharray="4,2"/></svg> 80% target</span>`:''}
            ${_yMax>=70?`<span><svg width="20" height="8" viewBox="0 0 20 8" style="vertical-align:middle"><line x1="1" y1="4" x2="19" y2="4" stroke="#e67e22" stroke-width="1" stroke-dasharray="4,2"/></svg> 70% floor</span>`:''}

                <td style="font-weight:800">${p.eggs}</td><td>${rateBadge(p.hdp)}</td>
                <td style="font-weight:700;color:${dc}">${diff>0?'+':''}${diff.toFixed(1)}%</td></tr>`;}).join('')}

      <button class="inner-tab ${ANA_TAB==='cells'?'active':''}" onclick="ANA_TAB='cells';renderReports()">Cells</button>

      <button class="inner-tab ${ANA_TAB==='trend'?'active':''}" onclick="ANA_TAB='trend';renderReports()">📈 Trend</button>
    </div>${tabContent}`;

  } else if(REP_TAB==='flock'){
    const bRecs=DB.getBirds().sort((a,b)=>a.date.localeCompare(b.date));

  } else if(REP_TAB==='feed'){

    const totalEggsForFCR=DB.getCols().filter(c=>validPenIds.has(c.penId)&&c.date>=_cutoff30).reduce((s,c)=>(c.entries||[]).reduce((ss,e)=>ss+(e.eggs||0),s),0);
    const eggKg=totalEggsForFCR*EGG_KG;
    const fcr=eggKg>0?(totalFeed/eggKg):null;
    const gPerEgg=totalEggsForFCR>0?((totalFeed*1000)/totalEggsForFCR):null;
    // Shared daily series — feeds the per-bird chart and the monthly table
    const fDaily=feedDailySeries(validPenIds);
    // Chart window — navigable via FEED_CHART_OFFSET
    const _chartEnd=(()=>{const d=new Date(DB.today());d.setDate(d.getDate()-FEED_CHART_OFFSET*30);return d.toISOString().slice(0,10);})();
    const _chartStart=(()=>{const d=new Date(DB.today());d.setDate(d.getDate()-FEED_CHART_OFFSET*30-30);return d.toISOString().slice(0,10);})();
    const chartFeed=fRecs.filter(r=>r.date>_chartStart&&r.date<=_chartEnd);
    const hasPrev=fRecs.some(r=>r.date<=_chartStart);
    const dailyFeed=Object.entries(chartFeed.reduce((m,r)=>{(m[r.date]=m[r.date]||{kg:0,req:0});m[r.date].kg+=r.feed_kg_used||0;m[r.date].req+=r.feed_req_kg||0;return m;},{}))
      .sort((a,b)=>a[0].localeCompare(b[0]));
    const feedChartSvg=(()=>{
      const n=dailyFeed.length; if(n===0)return'<div style="color:var(--gray);font-size:13px;padding:20px 0">No feed data for this period.</div>';

      const maxVal=Math.max(...dailyFeed.map(([,v])=>Math.max(v.kg,v.req||0)),1);
      const lblStep=Math.ceil(n/12);
      const bars=dailyFeed.map(([,v],i)=>{
        const x=i*slot+(slot-bW)/2,bH=Math.max(1,(v.kg/maxVal)*cH),y=cH-bH;

        const col=Math.abs(vr)>15?'#c0392b':Math.abs(vr)>10?'#e67e22':'#27ae60';
        const lbl=i%lblStep===0||i===n-1?v.kg.toFixed(0):'';
        return`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bW.toFixed(1)}" height="${bH.toFixed(1)}" fill="${col}" rx="1.5"/>${lbl?`<text x="${(x+bW/2).toFixed(1)}" y="${svgH-1}" text-anchor="middle" font-size="7" fill="#aaa">${lbl}</text>`:''}`;
      }).join('');
      const tPts=dailyFeed.map(([,v],i)=>{if(!v.req)return null;const x=i*slot+slot/2,y=cH-(v.req/maxVal)*cH;return`${x.toFixed(1)},${Math.max(0,y).toFixed(1)}`;}).filter(Boolean);

      return`<svg viewBox="0 0 ${svgW} ${svgH}" style="width:100%;height:auto;display:block;overflow:visible">
        <line x1="0" y1="0.5" x2="${svgW}" y2="0.5" stroke="#f0f0f0" stroke-width="1"/>

    const navBtnStyle='border:none;background:none;font-size:18px;cursor:pointer;padding:4px 8px;border-radius:6px;line-height:1';

    // ── Feed per bird per day (last 60 logged days) ──
    const gbdRows=fDaily.filter(d=>d.gPerBird!=null).slice(-60);
    const gbdSvg=lineChartSvg('gbd',gbdRows,[
      {name:'Actual',color:'#12946a',get:r=>r.gPerBird},

       extra:r=>`<div class="ttr"><em>Birds</em><strong>${r.birds}</strong></div>`});

    const momNote=(()=>{

          <tbody>${chartFeed.slice().reverse().map(r=>{

            const col=Math.abs(vr)>15?'var(--red)':Math.abs(vr)>10?'var(--amber)':'var(--g2)';
            return`<tr><td>${fmtDate(r.date)}</td><td>${r.feed_type||'—'}</td><td>${(r.feed_kg_used||0).toFixed(1)}</td>
              <td>${(r.feed_req_kg||0).toFixed(1)}</td><td style="color:${col};font-weight:700">${vr>0?'+':''}${vr.toFixed(0)}%</td></tr>`;
          }).join('')||'<tr><td colspan="5" style="text-align:center;color:var(--gray);padding:18px">No feed records.</td></tr>'}</tbody>
        </table></div>
      </div>`:''}

      <div class="sec-hdr">Feed per bird per day</div>
      <p style="font-size:12px;color:var(--gray);padding:0 16px 6px;margin:0">Grams eaten per bird against the breed standard for the flock's age. Moves before FCR does.</p>
      <div class="card" style="padding:16px">
        ${gbdSvg}
        <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:var(--gray)">
          <span style="display:flex;align-items:center;gap:5px"><svg width="22" height="10" viewBox="0 0 22 10"><line x1="0" y1="5" x2="22" y2="5" stroke="#12946a" stroke-width="2"/></svg>Actual</span>
          <span style="display:flex;align-items:center;gap:5px"><svg width="22" height="10" viewBox="0 0 22 10"><line x1="0" y1="5" x2="22" y2="5" stroke="#4895ef" stroke-width="2" stroke-dasharray="5 3"/></svg>Breed standard</span>
          <button class="tbtn" style="margin-left:auto" onclick="toggleFeedTbl('gbd')">${FEED_TBL.gbd?'Hide table':'Table'}</button>
        </div>
        ${gbdNote?`<div style="font-size:12.5px;color:var(--gray);margin-top:10px;padding-top:10px;border-top:1px solid #ecefed">${gbdNote}</div>`:''}
        ${FEED_TBL.gbd?`<div class="tscroll"><table class="dtbl">
          <thead><tr><th>Date</th><th>Age wk</th><th>Birds</th><th>Actual g</th><th>Std g</th><th>Diff</th></tr></thead>
          <tbody>${gbdRows.slice().reverse().map(r=>{
            const d=r.gPerBird-r.stdG;
            return`<tr><td>${fmtDate(r.date)}</td><td>${r.age??'—'}</td><td>${r.birds}</td><td>${r.gPerBird.toFixed(0)}</td>
              <td>${r.stdG}</td><td style="color:${Math.abs(d)>10?'var(--red)':'var(--g2)'};font-weight:700">${d>0?'+':''}${d.toFixed(0)}</td></tr>`;
          }).join('')||'<tr><td colspan="6" style="text-align:center;color:var(--gray);padding:18px">No data.</td></tr>'}</tbody>
        </table></div>`:''}
      </div>

      <div class="sec-hdr">Month over month</div>
      <p style="font-size:12px;color:var(--gray);padding:0 16px 6px;margin:0">FCR read next to flock age and lay rate — FCR is <em>supposed</em> to rise as birds age. The question is whether it is rising faster than age explains.</p>
      <div class="card" style="padding:16px">
        ${momSvg}
        <div style="display:flex;align-items:center;margin-top:8px">
          <button class="tbtn" style="margin-left:auto" onclick="toggleFeedTbl('mom')">${FEED_TBL.mom?'Hide table':'Table'}</button>
        </div>
        ${FEED_TBL.mom?`<div class="tscroll"><table class="dtbl">
          <thead><tr><th>Month</th><th>FCR</th><th>vs prev</th><th>Age</th><th>Lay %</th><th>g/bird/d</th><th>g/egg</th><th>Feed kg</th><th>Eggs</th></tr></thead>
          <tbody>${mRows.map((r,i)=>{
            const prev=(()=>{for(let j=i-1;j>=0;j--)if(mRows[j].fcr!=null)return mRows[j];return null;})();
            const d=(r.fcr!=null&&prev)?r.fcr-prev.fcr:null;
            const col=d==null?'var(--gray)':d>0.03?'var(--red)':d<-0.03?'var(--g2)':'var(--gray)';
            const arrow=d==null?'—':d>0.03?'▲':d<-0.03?'▼':'–';
            return`<tr${i===mRows.length-1?' style="background:var(--g5)"':''}>
              <td>${fmtMonth(r.m)}${r.days<20?' *':''}</td>
              <td style="font-weight:700;color:${fcrColour(r.fcr)}">${r.fcr!=null?r.fcr.toFixed(2):'—'}</td>
              <td style="color:${col};font-weight:700">${arrow}${d==null?'':' '+(d>0?'+':'')+d.toFixed(2)}</td>
              <td>${r.age??'—'}</td><td>${r.lay!=null?r.lay.toFixed(0)+'%':'—'}</td>
              <td>${r.gpb!=null?r.gpb.toFixed(0):'—'}</td><td>${r.gpe!=null?r.gpe.toFixed(0):'—'}</td>
              <td>${r.kg.toFixed(0)}</td><td>${r.eggs.toLocaleString()}</td></tr>`;
          }).join('')||'<tr><td colspan="9" style="text-align:center;color:var(--gray);padding:18px">No feed records yet.</td></tr>'}</tbody>
        </table></div>
        <div style="font-size:10.5px;color:var(--gray);text-align:right;margin-top:5px">swipe for intake and volumes →</div>`:''}
        <div style="font-size:12.5px;color:var(--gray);margin-top:10px;padding-top:10px;border-top:1px solid #ecefed">${momNote}${mRows.some(r=>r.days<20)?'<br>* partial month.':''}</div>
      </div>`;

  } else if(REP_TAB==='journal'){
    // Aggregate all notes from every module, sorted newest-first
    const journalEntries=[];
    DB.getBirds().forEach(r=>{if(r.notes)journalEntries.push({date:r.date,src:'Flock',srcCls:'badge-purple',icon:'🐔',note:r.notes,meta:`${r.opening_birds}→${r.closing_birds} birds · ${r.deaths} deaths`});});
    DB.getHealth().forEach(r=>{if(r.notes)journalEntries.push({date:r.date,src:'Health',srcCls:'badge-green',icon:'💊',note:r.notes,meta:`${r.droppings_observation||'—'} droppings${r.vaccination_or_medication?' · '+r.vaccination_or_medication:''}`});});
    DB.getFeed().forEach(r=>{if(r.notes)journalEntries.push({date:r.date,src:'Feed',srcCls:'badge-blue',icon:'🌾',note:r.notes,meta:`${r.feed_kg_used}kg used · ${r.feed_type}`});});
    DB.getExpenses().forEach(r=>{if(r.notes)journalEntries.push({date:r.date,src:'Expense',srcCls:'badge-red',icon:'💸',note:r.notes,meta:`${r.category} · ${fmtMoney(r.amount_ngn)}`});});
    DB.getSales().forEach(r=>{if(r.notes)journalEntries.push({date:r.date,src:'Sale',srcCls:'badge-green',icon:'🥚',note:r.notes,meta:`${r.product} · ${fmtMoney(r.total_amount_ngn)}`});});
    DB.getCols().filter(c=>c.notes).forEach(c=>{journalEntries.push({date:c.date,src:'Eggs',srcCls:'badge-amber',icon:'📝',note:c.notes,meta:`${c.penName} · ${c.lineName} · Side ${c.side} · ${c.roundLabel}`});});
    journalEntries.sort((a,b)=>b.date.localeCompare(a.date)||b.src.localeCompare(a.src));
    tabContent=journalEntries.length===0
      ?`<div class="empty" style="padding:48px 24px"><svg viewBox="0 0 24 24" style="width:44px;height:44px;stroke:var(--gray);fill:none;stroke-width:1.5;margin-bottom:12px"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg><h3>No notes yet</h3><p>Add notes when logging flock, health, feed, or sales records — they'll all appear here in one place.</p></div>`
      :`<div style="margin:12px 16px 4px;font-size:12px;color:var(--gray)">${journalEntries.length} note${journalEntries.length!==1?'s':''} across all modules</div>
        <div class="card" style="padding:0;overflow:hidden">
          ${journalEntries.map((e,i)=>{
            const showDate=i===0||e.date!==journalEntries[i-1].date;
            const dateHdr=showDate?`<div style="padding:8px 16px 4px;font-size:11px;font-weight:800;color:var(--gray);text-transform:uppercase;background:var(--light);border-bottom:1px solid #eee">${fmtDate(e.date)}</div>`:'';
            return`${dateHdr}<div style="padding:12px 16px;border-bottom:1px solid #f5f5f5">
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
                <span style="font-size:15px">${e.icon}</span>
                <span class="badge ${e.srcCls}" style="font-size:10px">${e.src}</span>
                <span style="font-size:11px;color:var(--gray)">${e.meta}</span>
              </div>
              <div style="font-size:14px;color:#1a1a1a;font-style:italic;line-height:1.5">"${e.note}"</div>
            </div>`;}).join('')}
        </div>`;

  } else if(REP_TAB==='finance'){
    const expenses=DB.getExpenses(), sales=DB.getSales();
    const today=DB.today(), thisMonth=today.slice(0,7);
    const activeMonth=FIN_MONTH||thisMonth;
    const monthExp=expenses.filter(e=>e.date.startsWith(activeMonth)).reduce((s,e)=>s+(e.amount_ngn||0),0);
    const monthSales=sales.filter(s=>s.date.startsWith(activeMonth)).reduce((s,e)=>s+(e.total_amount_ngn||0),0);
    const allExp=expenses.reduce((s,e)=>s+(e.amount_ngn||0),0);
    const allSales=sales.reduce((s,e)=>s+(e.total_amount_ngn||0),0);
    const totalEggsAll=DB.getCols().filter(c=>validPenIds.has(c.penId)).reduce((s,c)=>(c.entries||[]).reduce((ss,e)=>ss+(e.eggs||0),s),0);
    const costPerEgg=totalEggsAll>0?(allExp/totalEggsAll):null;
    const costPerCrate=costPerEgg?costPerEgg*30:null;
    const catMap={};
    expenses.forEach(e=>{catMap[e.category]=(catMap[e.category]||0)+(e.amount_ngn||0);});
    const topCats=Object.entries(catMap).sort((a,b)=>b[1]-a[1]).slice(0,6);
    const maxCat=topCats[0]?.[1]||1;
    const monthSet=new Set([thisMonth]);
    expenses.forEach(e=>{if(e.date)monthSet.add(e.date.slice(0,7));});
    sales.forEach(s=>{if(s.date)monthSet.add(s.date.slice(0,7));});
    const monthOpts=[...monthSet].sort().reverse().map(m=>{
      const d=new Date(m+'-01T00:00:00');
      const lbl=d.toLocaleDateString('en-GB',{month:'long',year:'numeric'})+(m===thisMonth?' (This Month)':'');
      return`<option value="${m}" ${m===activeMonth?'selected':''}>${lbl}</option>`;
    }).join('');
    tabContent=`
      <div style="background:var(--white);padding:10px 16px;border-bottom:1px solid #eee;display:flex;align-items:center;gap:10px;margin:0 16px 10px;border-radius:var(--radius);box-shadow:var(--shadow)">
        <span style="font-size:12px;font-weight:700;color:var(--gray);white-space:nowrap">Month:</span>
        <select style="flex:1;padding:8px 12px;border:1.5px solid #ddd;border-radius:10px;font-size:14px;font-weight:600;background:var(--white)"
          onchange="FIN_MONTH=this.value;renderReports()">${monthOpts}</select>
        ${FIN_MONTH&&FIN_MONTH!==thisMonth?`<button class="btn btn-secondary btn-sm" onclick="FIN_MONTH=null;renderReports()">Clear</button>`:''}
      </div>
      <div class="kpi-row-3">
        <div class="kpi"><div class="kpi-val" style="color:var(--g2)">${fmtMoney(monthSales)}</div><div class="kpi-lbl">Sales (${finMonthLabel})</div></div>
        <div class="kpi"><div class="kpi-val" style="color:var(--red)">${fmtMoney(monthExp)}</div><div class="kpi-lbl">Expenses (${finMonthLabel})</div></div>
        <div class="kpi"><div class="kpi-val" style="color:${monthSales-monthExp>=0?'var(--g2)':'var(--red)'}">${fmtMoney(monthSales-monthExp)}</div><div class="kpi-lbl">Margin (${finMonthLabel})</div></div>
      </div>
      <div class="kpi-row-2">
        <div class="kpi"><div class="kpi-val">${costPerEgg?'₦'+costPerEgg.toFixed(0):'—'}</div><div class="kpi-lbl">Cost/Egg (All-Time)</div></div>
        <div class="kpi"><div class="kpi-val">${costPerCrate?'₦'+costPerCrate.toFixed(0):'—'}</div><div class="kpi-lbl">Cost/Crate (All-Time)</div></div>
      </div>
      <div class="sec-hdr" style="margin-top:8px">Top Expense Categories</div>
      <div class="card" style="padding:0;overflow:hidden">
        ${topCats.map(([cat,amt])=>{const pct=Math.round(amt/maxCat*100);
          return`<div class="list-item"><div><div style="font-weight:700;font-size:14px">${cat}</div>
            <div style="height:6px;width:${pct}%;background:var(--g3);border-radius:3px;margin-top:4px;min-width:4px"></div></div>
            <div style="font-weight:800;color:var(--red)">${fmtMoney(amt)}</div></div>`;}).join('')||
          '<div class="empty" style="padding:24px"><p>No expense data.</p></div>'}
      </div>
      <div class="sec-hdr">All-Time Summary</div>
      <div class="card">
        <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f5f5f5">
          <span style="font-weight:700">Total Revenue</span><span style="color:var(--g2);font-weight:800">${fmtMoney(allSales)}</span></div>
        <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f5f5f5">
          <span style="font-weight:700">Total Expenses</span><span style="color:var(--red);font-weight:800">${fmtMoney(allExp)}</span></div>
        <div style="display:flex;justify-content:space-between;padding:8px 0;font-size:16px">
          <span style="font-weight:800">Net Profit/Loss</span><span style="color:${allSales-allExp>=0?'var(--g2)':'var(--red)'};font-weight:800">${fmtMoney(allSales-allExp)}</span></div>
      </div>`;
  }

  el.innerHTML=`<div class="topbar"><div><h1>Reports</h1><small>${topbarLabel}</small></div></div>
    ${REP_TAB==='eggs'?`<div style="background:var(--white);padding:10px 16px;border-bottom:1px solid #eee;display:flex;align-items:center;gap:10px">
      <span style="font-size:12px;font-weight:700;color:var(--gray);white-space:nowrap">View:</span>
      <button onclick="openDatePicker()" style="flex:1;padding:8px 12px;border:1.5px solid #ddd;border-radius:10px;font-size:14px;font-weight:600;background:var(--white);color:#1a1a1a;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer">
        <span>${modeLabel}</span><span style="color:var(--g3);font-size:12px">📅 ▾</span></button>
      ${ANA_DATE?`<button class="btn btn-secondary btn-sm" onclick="ANA_DATE=null;renderReports()">Clear</button>`:''}
    </div>`:''}
    <div class="inner-tabs">
      <button class="inner-tab ${REP_TAB==='eggs'?'active':''}" onclick="REP_TAB='eggs';renderReports()">Eggs</button>
      <button class="inner-tab ${REP_TAB==='flock'?'active':''}" onclick="REP_TAB='flock';renderReports()">Flock</button>
      <button class="inner-tab ${REP_TAB==='feed'?'active':''}" onclick="REP_TAB='feed';renderReports()">Feed</button>
      <button class="inner-tab ${REP_TAB==='finance'?'active':''}" onclick="REP_TAB='finance';renderReports()">Finance</button>
      <button class="inner-tab ${REP_TAB==='journal'?'active':''}" onclick="REP_TAB='journal';renderReports()">📓 Journal</button>
    </div>
    ${tabContent}
    <div style="height:12px"></div>`;
  if(REP_TAB==='feed')wireFeedCharts();
}
function confirmReset(){
  openModal(`<div class="modal-ttl">Reset Data? <button class="modal-x" onclick="closeModal()">×</button></div>
    <p style="font-size:14px;color:var(--gray);margin-bottom:18px">All egg collection records will be deleted. Farm setup and other logs are kept.</p>
    <div style="display:flex;flex-direction:column;gap:8px">
      <button class="btn btn-danger" onclick="closeModal();DB.saveCols([]);confirmSave('Egg records cleared');renderReports()">Delete Egg Records</button>
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button></div>`);
}

                  <button class="btn btn-secondary btn-sm" onclick="editStand('${pen.id}','${line.id}','${s.id}')">Edit</button>

          <button class="btn btn-danger btn-sm" onclick="deletePen('${pen.id}')">Delete Pen</button>
        </div>
      </div></div>`).join('');

  el.innerHTML=`<div class="topbar"><div><h1>Settings</h1></div></div>
    <div class="card">
      <div class="card-title">Farm Details</div>
      <div class="field"><label>Farm Name</label><input type="text" id="s_name" value="${farm.name||''}" placeholder="e.g. Green Valley Farms"></div>

      <div style="background:var(--g5);border-radius:8px;padding:9px 12px;font-size:12px;color:var(--g1);margin-bottom:8px">
        🌾 Feed: <b>${fr} g/bird/day</b> &nbsp;·&nbsp; 💧 Water: <b>${wr} ml/bird/day</b><br><span style="font-weight:500;opacity:.75">${ph} — auto-calculated by flock age</span>
      </div>`;})()}
      <button class="btn btn-primary" onclick="saveFarm()">Save Farm Details</button>
    </div>
    ${(()=>{const b=getDocBusiness(),f=farm;return`
    <div class="card">
      <div class="card-title">Receipts &amp; Invoices</div>
      <p style="font-size:13px;color:var(--gray);margin-bottom:10px">
        These details print on the receipt you give a customer. Leave anything blank and it simply won't appear.

        <input type="text" id="s_doc_name" value="${f.doc_name||''}" placeholder="${(f.name||'My Farm').replace(/"/g,'&quot;')}"></div>

          <input type="tel" id="s_doc_phone" value="${f.doc_phone||''}" placeholder="0803 000 0000"></div>
        <div class="field"><label>RC number <span style="font-size:11px;color:var(--gray);font-weight:400">optional</span></label>
          <input type="text" id="s_doc_rc" value="${f.doc_rc||''}" placeholder="RC 1234567"></div>
      </div>
      <div class="field"><label>Email <span style="font-size:11px;color:var(--gray);font-weight:400">optional</span></label>
        <input type="email" id="s_doc_email" value="${f.doc_email||''}" placeholder="farm@example.com"></div>
      <div style="font-size:11px;font-weight:800;color:var(--gray);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 8px">Where customers pay</div>
      <p style="font-size:12px;color:var(--gray);margin-bottom:8px">Printed only when a balance is still owed.</p>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="field"><label>Bank</label>
          <input type="text" id="s_bank_name" value="${f.bank_name||''}" placeholder="e.g. Moniepoint"></div>
        <div class="field"><label>Account number</label>
          <input type="text" id="s_bank_account" value="${f.bank_account||''}" placeholder="0123456789" inputmode="numeric"></div>
      </div>
      <div class="field"><label>Account name</label>
        <input type="text" id="s_bank_account_name" value="${f.bank_account_name||''}" placeholder="As it appears at the bank"></div>
      <div style="font-size:11px;font-weight:800;color:var(--gray);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 8px">Terms by product</div>
      <p style="font-size:12px;color:var(--gray);margin-bottom:8px">Keep these short — the customer reads them on a phone.</p>
      ${PRODUCT_TYPES.map((p,i)=>`
        <div class="field"><label>${p}</label>
          <textarea id="s_terms_${i}" rows="2" placeholder="${DEFAULT_DOC_TERMS[p]}">${(f.doc_terms||{})[p]||''}</textarea></div>`).join('')}
      <button class="btn btn-primary" onclick="saveDocSettings()">Save Document Details</button>
      ${!isDocSetupComplete()?`<div class="alert-item alert-amber" style="margin-top:10px">
        Add at least an address and phone number so receipts don't go out looking unfinished.
      </div>`:''}
    </div>`;})()}

// ── DANGER ZONE (gated bulk reset) ──
// Bulk resets are the one place a single tap could erase a season of records, so
// they are gated three ways: an impact summary stating exactly what goes, a fresh
// export in this session, and the manager PIN. Deletes land in trash either way.
const MODULE_LABELS={cols:'Egg Collection Records',birds:'Flock Records',feed:'Feed Records',
  health:'Health Records',finance:'Finance Records (expenses, sales, receivables, customers, payments)'};
const MODULE_KEYS={cols:[KEYS.cols],birds:[KEYS.birds],feed:[KEYS.feed],health:[KEYS.health],
  finance:[KEYS.expenses,KEYS.sales,KEYS.recv,KEYS.customers,KEYS.payments]};
let EXPORTED_THIS_SESSION=false;
function toggleDangerZone(){
  const el=document.getElementById('danger-zone');if(!el)return;
  const open=el.style.display!=='none';
  el.style.display=open?'none':'flex';
  const b=document.getElementById('danger-toggle');
  if(b)b.textContent=open?'Show bulk reset options':'Hide bulk reset options';
}
function _moduleImpact(mod){
  const keys=MODULE_KEYS[mod]||[];
  let count=0,from=null,to=null;
  keys.forEach(k=>DB._arr(k).forEach(r=>{
    count++;const d=r.date;
    if(d){if(!from||d<from)from=d;if(!to||d>to)to=d;}
  }));
  return {keys,count,from,to};
}
function resetModule(mod){
  const label=MODULE_LABELS[mod]||mod, imp=_moduleImpact(mod);
  if(!imp.count){
    openModal(`<div class="modal-ttl">Nothing to delete <button class="modal-x" onclick="closeModal()">×</button></div>
      <p style="font-size:14px;color:var(--gray);margin-bottom:18px">There are no ${label.toLowerCase()} to reset.</p>
      <button class="btn btn-secondary" onclick="closeModal()">OK</button>`);
    return;
  }
  const span=imp.from?` covering <b>${fmtDate(imp.from)}</b> → <b>${fmtDate(imp.to)}</b>`:'';
  openModal(`<div class="modal-ttl">Delete ${label}? <button class="modal-x" onclick="closeModal()">×</button></div>
    <div style="background:#fee2e2;border-left:3px solid var(--red);padding:10px 14px;border-radius:0 8px 8px 0;font-size:13px;color:#7f1d1d;margin-bottom:14px">
      This deletes <b>${imp.count}</b> record${imp.count===1?'':'s'}${span}.
    </div>
    <div style="background:var(--g5);border-radius:8px;padding:9px 12px;font-size:12px;color:var(--g1);margin-bottom:14px">
      Recoverable for ${TRASH_TTL_DAYS} days from Settings → Recently Deleted.
    </div>
    <div class="field"><label>Step 1 — take a fresh export</label>
      <button class="btn btn-secondary" id="rz_export" onclick="exportData();document.getElementById('rz_export').textContent='Exported ✓'">${EXPORTED_THIS_SESSION?'Exported ✓':'Export All Data (JSON)'}</button></div>
    <div class="field"><label>Step 2 — manager PIN</label>
      <input type="password" id="rz_pin" placeholder="Manager PIN" autocomplete="off"></div>
    <div id="rz_err" style="color:var(--red);font-size:12px;min-height:16px;margin-bottom:8px"></div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <button class="btn btn-danger" id="rz_go" onclick="doResetModule('${mod}')">Delete ${imp.count} record${imp.count===1?'':'s'}</button>
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button></div>`);
}
async function doResetModule(mod){
  const errEl=document.getElementById('rz_err'), btn=document.getElementById('rz_go');
  const setErr=m=>{if(errEl)errEl.textContent=m;};
  const reset=t=>{if(btn){btn.disabled=false;btn.textContent=t;}};
  const original=btn?btn.textContent:'Delete';
  const pin=(document.getElementById('rz_pin')?.value||'').trim();
  if(!EXPORTED_THIS_SESSION){setErr('Take a fresh export first (step 1).');return;}
  if(!pin){setErr('Enter the manager PIN.');return;}
  setErr('');if(btn){btn.disabled=true;btn.textContent='Verifying…';}
  try{
    const m=await db.collection('appConfig').doc('master').get();
    if(!m.exists||m.data().pin!==pin){setErr('Incorrect manager PIN.');reset(original);return;}
  }catch(e){setErr('Could not verify PIN — check your connection.');reset(original);return;}
  if(btn)btn.textContent='Deleting…';
  const imp=_moduleImpact(mod), batchId=uid();
  let done=0;
  try{
    for(const k of imp.keys){await _deleteCol(k,batchId);done++;}
  }catch(e){
    setErr(done?'Stopped part-way — check Recently Deleted, then retry.':'Delete failed — nothing was removed.');
    reset(original);renderSettings();return;
  }
  closeModal();
  toast(`${imp.count} record${imp.count===1?'':'s'} moved to Recently Deleted`);
  renderSettings();
}
// ── RECENTLY DELETED (restore UI) ──
async function openTrashModal(){
  const shell=body=>`<div class="modal-ttl">Recently Deleted <button class="modal-x" onclick="closeModal()">×</button></div>${body}`;
  openModal(shell('<p style="font-size:13px;color:var(--gray)">Loading…</p>'));
  let items;
  try{items=await loadTrash();}
  catch(e){
    openModal(shell(`<p style="font-size:13px;color:var(--red);margin-bottom:12px">Could not load deleted records. Check your connection.</p>
      <button class="btn btn-secondary" onclick="closeModal()">Close</button>`));
    return;
  }
  if(!items.length){
    openModal(shell(`<p style="font-size:13px;color:var(--gray);margin-bottom:12px">Nothing has been deleted in the last ${TRASH_TTL_DAYS} days.</p>
      <button class="btn btn-secondary" onclick="closeModal()">Close</button>`));
    return;
  }
  // One row per delete action, not per record, so a bulk reset reads as a single undoable event.
  const groups={};
  items.forEach(t=>{
    const g=groups[t.batch_id]||(groups[t.batch_id]={id:t.batch_id,at:t.deleted_at,labels:{},n:0});
    g.n++;g.labels[t.label]=(g.labels[t.label]||0)+1;
    if(t.deleted_at>g.at)g.at=t.deleted_at;
  });
  const rows=Object.values(groups).sort((a,b)=>b.at.localeCompare(a.at)).map(g=>{
    const what=Object.entries(g.labels).map(([l,c])=>`${c} × ${l}`).join(' · ');
    const when=new Date(g.at).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
    return `<div class="list-item" style="display:flex;justify-content:space-between;align-items:center;gap:10px">
      <div><div style="font-weight:600;font-size:13px">${what}</div>
        <div style="font-size:11px;color:var(--gray)">${when}</div></div>
      <button class="btn btn-secondary btn-sm" onclick="doRestoreTrash('${g.id}',this)">Restore</button></div>`;
  }).join('');
  openModal(shell(`<p style="font-size:12px;color:var(--gray);margin-bottom:10px">Kept for ${TRASH_TTL_DAYS} days, then permanently removed.</p>
    ${rows}
    <div id="rt_err" style="color:var(--red);font-size:12px;min-height:16px;margin-top:8px"></div>
    <button class="btn btn-secondary" style="margin-top:6px" onclick="closeModal()">Close</button>`));
}
async function doRestoreTrash(batchId,btn){
  if(btn){btn.disabled=true;btn.textContent='Restoring…';}
  try{
    const n=await restoreTrashBatch(batchId);
    toast(`${n} record${n===1?'':'s'} restored ✓`);
    openTrashModal();renderSettings();
  }catch(e){
    const el=document.getElementById('rt_err');
    if(el)el.textContent='Restore failed — check your connection and try again.';
    if(btn){btn.disabled=false;btn.textContent='Restore';}
  }
}

// Export Data
function exportData(){
  const farm=DB.getFarm(), cols=DB.getCols(), birds=DB.getBirds();
  const feed=DB.getFeed(), health=DB.getHealth(), expenses=DB.getExpenses();
  const sales=DB.getSales();
  const customers=DB.getCustomers(), payments=DB.getPayments();
  const validPenIds=new Set((farm?.pens||[]).map(p=>p.id));
  // Build daily_egg_production summary
  const eggDayMap={};
  cols.filter(c=>validPenIds.has(c.penId)).forEach(c=>{
    if(!eggDayMap[c.date])eggDayMap[c.date]={date:c.date,age_weeks:null,eggs_collected:0,cracked_eggs:0,eggs_spoiled:0};
    (c.entries||[]).forEach(e=>{eggDayMap[c.date].eggs_collected+=(e.eggs||0);eggDayMap[c.date].cracked_eggs+=(e.broken||0);});
  });
  birds.forEach(b=>{if(eggDayMap[b.date])eggDayMap[b.date].age_weeks=b.age_weeks;});
  const bundle={
    exported_at:new Date().toISOString(),source:'LayerTrack',version:'1.0',
    farm,
    daily_egg_production:Object.values(eggDayMap).sort((a,b)=>a.date.localeCompare(b.date)),
    egg_collection_detail:cols,
    daily_bird_status:birds.map(b=>({date:b.date,opening_birds:b.opening_birds,age_weeks:b.age_weeks,
      deaths:b.deaths,culls:b.culls,closing_birds:b.closing_birds,notes:b.notes})),
    daily_feed_usage:feed.map(f=>({date:f.date,age_weeks:f.age_weeks,feed_type:f.feed_type,
      feed_kg_used:f.feed_kg_used,feed_req_kg:f.feed_req_kg})),
    health_log:health.map(h=>({date:h.date,water_consumed_liters:h.water_consumed_liters,
      droppings_observation:h.droppings_observation,vaccination_or_medication:h.vaccination_or_medication,
      admin_method:h.admin_method,notes:h.notes})),
    expenses:expenses.map(e=>({date:e.date,category:e.category,amount_usd:e.amount_usd,amount_ngn:e.amount_ngn,notes:e.notes})),
    sales:sales.map(s=>({id:s.id,date:s.date,product:s.product,quantity:s.quantity,unit_price:s.unit_price_ngn,
      total_amount:s.total_amount_ngn,payment_type:s.payment_type||'cash',paid:s.paid!==false,
      amount_paid:getSalePaid(s),balance_due:getSaleBalance(s),
      due_date:s.due_date||null,customer:s.customer,customer_id:s.customer_id||null,notes:s.notes})),
    customers:customers.map(c=>({id:c.id,name:c.name,name_normalized:c.name_normalized,phone:c.phone,
      customer_type:c.customer_type,notes:c.notes,created_at:c.created_at})),
    payments:payments.map(p=>({id:p.id,sale_id:p.sale_id,date:p.date,amount_ngn:p.amount_ngn,
      method:p.method,kind:p.kind,notes:p.notes})),
    receivables:sales.filter(s=>s.payment_type==='credit'&&getSaleBalance(s)>0).map(s=>({
      sale_id:s.id,sale_date:s.date,customer:s.customer,customer_id:s.customer_id||null,
      product:s.product,quantity:s.quantity,
      total_ngn:s.total_amount_ngn,paid_ngn:getSalePaid(s),balance_ngn:getSaleBalance(s),
      due_date:s.due_date||null}))
  };
  const blob=new Blob([JSON.stringify(bundle,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;
  a.download=`LayerTrack_export_${DB.today()}.json`;a.click();
  URL.revokeObjectURL(url);EXPORTED_THIS_SESSION=true;toast('Export complete ✓');
}
function _mergeById(existing,incoming){
  const map=new Map((existing||[]).map(r=>[r.id,r]));
  (incoming||[]).forEach(r=>{if(r.id&&!map.has(r.id))map.set(r.id,r);});
  return Array.from(map.values());
}
function importData(input){
  const file=input.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    let data;
    try{ data=JSON.parse(e.target.result); }
    catch(err){
      openModal(`<div class="modal-ttl">Import Failed <button class="modal-x" onclick="closeModal()">×</button></div>
        <div style="background:#fee2e2;border-left:3px solid var(--red);padding:10px 14px;border-radius:0 8px 8px 0;font-size:13px;color:#7f1d1d;margin-bottom:12px">
          The file could not be parsed as JSON.<br><b>Error:</b> ${err.message}
        </div>
        <button class="btn btn-secondary" onclick="closeModal()">OK</button>`);
      input.value=''; return;
    }
    const counts={};
    if(data.farm){ DB.saveFarm(data.farm); counts.farm='1 farm config'; }
    if(data.egg_collection_detail?.length){ const m=_mergeById(DB.getCols(),data.egg_collection_detail); DB.saveCols(m); counts.eggs=data.egg_collection_detail.length+' egg sessions merged'; }
    if(data.daily_bird_status?.length){ const m=_mergeById(DB._arr(KEYS.birds),data.daily_bird_status); DB._set(KEYS.birds,m); counts.birds=data.daily_bird_status.length+' bird records merged'; }
    if(data.daily_feed_usage?.length){ const m=_mergeById(DB._arr(KEYS.feed),data.daily_feed_usage); DB._set(KEYS.feed,m); counts.feed=data.daily_feed_usage.length+' feed records merged'; }
    if(data.health_log?.length){ const m=_mergeById(DB._arr(KEYS.health),data.health_log); DB._set(KEYS.health,m); counts.health=data.health_log.length+' health records merged'; }
    if(data.expenses?.length){ const m=_mergeById(DB._arr(KEYS.expenses),data.expenses); DB._set(KEYS.expenses,m); counts.expenses=data.expenses.length+' expenses merged'; }
    if(data.sales?.length){ const m=_mergeById(DB._arr(KEYS.sales),data.sales); DB._set(KEYS.sales,m); counts.sales=data.sales.length+' sales merged'; }
    if(data.customers?.length){ const m=_mergeById(DB._arr(KEYS.customers),data.customers); DB._set(KEYS.customers,m); counts.customers=data.customers.length+' customers merged'; }
    if(data.payments?.length){ const m=_mergeById(DB._arr(KEYS.payments),data.payments); DB._set(KEYS.payments,m); counts.payments=data.payments.length+' payments merged'; }
    // Re-render all tabs so data is visible everywhere
    renderHome(); renderFlock(); renderFeed(); renderHealth(); renderFinance(); renderReports(); renderSettings();
    const lines=Object.values(counts);
    if(lines.length===0){
      openModal(`<div class="modal-ttl">Nothing Imported <button class="modal-x" onclick="closeModal()">×</button></div>
        <div style="font-size:13px;color:var(--gray);margin-bottom:12px">The file was valid JSON but contained no recognisable data arrays. Check that the file came from the LayerTrack converter.</div>
        <button class="btn btn-secondary" onclick="closeModal()">OK</button>`);
    } else {
      openModal(`<div class="modal-ttl">Import Complete ✓ <button class="modal-x" onclick="closeModal()">×</button></div>
        <div style="background:#d1fae5;border-left:3px solid var(--g2);padding:10px 14px;border-radius:0 8px 8px 0;font-size:13px;color:#065f46;margin-bottom:12px">
          ${lines.map(l=>`✓ ${l}`).join('<br>')}
        </div>
        <div style="font-size:12px;color:var(--gray);margin-bottom:12px">Existing data was preserved. New records were added alongside it.</div>
        <button class="btn btn-primary" onclick="closeModal()">Done</button>`);
    }
    input.value='';
  };
  reader.readAsText(file);
}

function showTrendTip(evt, pt) {
  const cr=Math.floor(pt.eggs/30),lp=pt.eggs%30;
  const eggStr=cr>0
    ?cr+' crate'+(cr>1?'s':'')+(lp>0?` <span style="font-size:10px;color:#999">${lp} pcs</span>`:'')
    :lp+' pcs';
  const col=pt.hdp>=80?'#27ae60':pt.hdp>=70?'#e67e22':'#c0392b';
  document.getElementById('trendTip').innerHTML=
    `<div style="font-weight:700;font-size:12px;margin-bottom:5px;color:#333">${pt.label}</div>`+
    `<div style="font-size:11px;margin-bottom:2px">Avg HDP: <b style="color:${col}">${pt.hdp.toFixed(1)}%</b></div>`+
    `<div style="font-size:11px">Eggs: <b>${eggStr}</b></div>`;
  document.getElementById('trendTip').style.display='block';
  positionTrendTip(evt);
}
function positionTrendTip(evt) {
  const tip=document.getElementById('trendTip');
  if(tip.style.display==='none')return;
  const x=evt.clientX+16,y=evt.clientY-14;
  const tw=tip.offsetWidth||160,th=tip.offsetHeight||70;
  tip.style.left=Math.min(x,window.innerWidth-tw-8)+'px';
  tip.style.top=Math.max(y-th,8)+'px';
}
function hideTrendTip(){document.getElementById('trendTip').style.display='none';}
